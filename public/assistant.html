<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Güvenlik - Asistan</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .assistant-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 16px;
            height: calc(100vh - 52px - 32px);
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        /* SOL — Chat */
        .chat-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .ai-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-glow);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .chat-header .ai-info h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .chat-header .ai-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .ai-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--success);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: slideIn 0.2s ease;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: var(--accent);
            color: white;
        }

        .message.bot .avatar {
            background: var(--accent-glow);
            border: 1px solid var(--accent);
        }

        .message .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.user .bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .bubble {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message .bubble table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 13px;
        }

        .message .bubble th {
            background: rgba(255,255,255,0.1);
            padding: 6px 10px;
            text-align: left;
            font-size: 11px;
        }

        .message .bubble td {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 12px 14px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typing 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quick-commands {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .quick-cmd {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .quick-cmd:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
        }

        /* SAĞ — Uyarılar & İstatistik */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .alert-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }

        .alert-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .alert-item:last-child { border-bottom: none; }

        .alert-item .alert-icon {
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .alert-item .alert-text { flex: 1; }
        .alert-item .alert-text .alert-title { font-weight: 500; }
        .alert-item .alert-text .alert-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .alert-item.red .alert-icon { filter: hue-rotate(0deg); }
        .alert-item.yellow .alert-icon { filter: hue-rotate(30deg); }

        .stat-grid-small {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-mini {
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            padding: 10px;
            text-align: center;
        }

        .stat-mini .val {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-mini .lbl {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .empty-alerts {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .assistant-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .chat-panel { height: 60vh; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span>🏢</span> Site Güvenlik</div>
        <ul class="nav-links">
            <li><a href="/">🚪 Giriş Kayıt</a></li>
            <li><a href="/admin.html">⚙️ Yönetim</a></li>
            <li><a href="/logs.html">📋 Loglar</a></li>
            <li><a href="/whatsapp.html">📱 WhatsApp</a></li>
            <li><a href="/assistant.html" class="active">🤖 Asistan</a></li>
        </ul>
    </nav>

    <div class="assistant-layout">

        <!-- SOL: Chat Paneli -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="ai-avatar">🤖</div>
                <div class="ai-info">
                    <h3>Güvenlik Asistanı</h3>
                    <p>Sorularınızı yazın, size yardımcı olayım</p>
                </div>
                <div class="ai-status">
                    <span class="status-dot online"></span>
                    Aktif
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <!-- Karşılama mesajı -->
            </div>

            <div class="chat-input-area">
                <div class="quick-commands" id="quickCommands">
                    <button class="quick-cmd" onclick="sendQuick('Bugünkü girişleri göster')">📋 Bugünkü girişler</button>
                    <button class="quick-cmd" onclick="sendQuick('Onay bekleyen misafirler var mı?')">⏳ Bekleyen onaylar</button>
                    <button class="quick-cmd" onclick="sendQuick('WhatsApp durumu nedir?')">📱 WhatsApp durumu</button>
                    <button class="quick-cmd" onclick="sendQuick('Bugün kaç giriş oldu?')">📊 İstatistik</button>
                    <button class="quick-cmd" onclick="sendQuick('Anormal giriş var mı?')">🚨 Anomali kontrolü</button>
                </div>
                <div class="input-row">
                    <input type="text" class="form-control" id="chatInput"
                        placeholder="Örn: B3 dairesine bugün kaç misafir geldi?"
                        onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="btn btn-primary" onclick="sendMessage()">Gönder</button>
                </div>
            </div>
        </div>

        <!-- SAĞ: Uyarılar & İstatistik -->
        <div class="side-panel">

            <!-- Akıllı Uyarılar -->
            <div class="alert-card">
                <h3>🚨 Akıllı Uyarılar <span id="alertBadge" style="display:none" class="badge badge-danger">0</span></h3>
                <div id="alertList">
                    <div class="empty-alerts">⏳ Kontrol ediliyor...</div>
                </div>
            </div>

            <!-- Bugün İstatistik -->
            <div class="alert-card">
                <h3>📊 Bugün</h3>
                <div class="stat-grid-small">
                    <div class="stat-mini">
                        <div class="val" id="sToplam">-</div>
                        <div class="lbl">Toplam</div>
                    </div>
                    <div class="stat-mini">
                        <div class="val" id="sMisafir">-</div>
                        <div class="lbl">Misafir</div>
                    </div>
                    <div class="stat-mini">
                        <div class="val" id="sKurye">-</div>
                        <div class="lbl">Kurye/Kargo</div>
                    </div>
                    <div class="stat-mini">
                        <div class="val" id="sBekleyen">-</div>
                        <div class="lbl">Bekleyen Onay</div>
                    </div>
                </div>
            </div>

            <!-- WhatsApp Durumu -->
            <div class="alert-card">
                <h3>📱 WhatsApp</h3>
                <div id="waStatusCard" style="text-align:center; padding: 12px; font-size: 14px;">
                    Kontrol ediliyor...
                </div>
            </div>

        </div>
    </div>

    <div class="toast-container" id="toasts"></div>

    <script>
    // ==================== MESAJLAŞMA ====================

    const messages = [];

    function addMessage(role, content, isHTML = false) {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = `message ${role}`;

        const avatarText = role === 'user' ? '👤' : '🤖';
        div.innerHTML = `
            <div class="avatar">${avatarText}</div>
            <div class="bubble">${isHTML ? content : escapeHtml(content)}</div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        messages.push({ role, content });
    }

    function showTyping() {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typingIndicator';
        div.innerHTML = `
            <div class="avatar">🤖</div>
            <div class="bubble">
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\n/g, '<br>');
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        addMessage('user', text);
        showTyping();

        try {
            const resp = await fetch('/api/assistant/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: text })
            });
            const data = await resp.json();
            removeTyping();

            if (data.html) {
                addMessage('bot', data.response, true);
            } else {
                addMessage('bot', data.response);
            }

            // Uyarıları yenile
            loadAlerts();
        } catch (e) {
            removeTyping();
            addMessage('bot', '❌ Sunucuya bağlanılamadı. Lütfen tekrar deneyin.');
        }
    }

    function sendQuick(text) {
        document.getElementById('chatInput').value = text;
        sendMessage();
    }

    // ==================== UYARILAR ====================

    async function loadAlerts() {
        try {
            const resp = await fetch('/api/assistant/alerts');
            const data = await resp.json();
            const list = document.getElementById('alertList');
            const badge = document.getElementById('alertBadge');

            if (!data.alerts || data.alerts.length === 0) {
                list.innerHTML = `<div class="empty-alerts">✅ Herhangi bir uyarı yok</div>`;
                badge.style.display = 'none';
                return;
            }

            badge.style.display = 'inline-flex';
            badge.textContent = data.alerts.length;

            list.innerHTML = data.alerts.map(a => `
                <div class="alert-item ${a.level}">
                    <div class="alert-icon">${a.icon}</div>
                    <div class="alert-text">
                        <div class="alert-title">${escapeHtml(a.title)}</div>
                        <div class="alert-sub">${escapeHtml(a.subtitle)}</div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            document.getElementById('alertList').innerHTML =
                `<div class="empty-alerts">⚠️ Uyarılar yüklenemedi</div>`;
        }
    }

    // ==================== İSTATİSTİK ====================

    async function loadStats() {
        try {
            const today = new Date();
            const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            const raw = await fetch(`/api/logs/stats?date=${dateStr}`).then(r => r.json());

            let byTypeArr = Array.isArray(raw) ? raw : (raw.byType || []);
            let total = Array.isArray(raw) ? raw.reduce((s,r)=>s+r.count,0) : (raw.total || 0);

            const byType = {};
            byTypeArr.forEach(r => byType[r.type] = r.count);

            document.getElementById('sToplam').textContent = total;
            document.getElementById('sMisafir').textContent = byType.misafir || 0;
            document.getElementById('sKurye').textContent = (byType.kurye||0) + (byType.kargo||0) + (byType.market||0);

            // Bekleyen onayları getir
            const pending = await fetch('/api/assistant/pending').then(r => r.json());
            document.getElementById('sBekleyen').textContent = pending.count || 0;
            if (pending.count > 0) {
                document.getElementById('sBekleyen').style.color = 'var(--warning)';
            }
        } catch (e) { }
    }

    // ==================== WHATSAPP DURUMU ====================

    async function loadWaStatus() {
        try {
            const st = await fetch('/api/whatsapp/status').then(r => r.json());
            const el = document.getElementById('waStatusCard');
            if (st.isReady) {
                el.innerHTML = `<span class="status-dot online"></span> <span style="color:var(--success);font-weight:600">Bağlı</span><br><small style="color:var(--text-muted)">Bildirimler aktif</small>`;
            } else {
                el.innerHTML = `<span class="status-dot offline"></span> <span style="color:var(--danger);font-weight:600">Bağlı Değil</span><br><small style="color:var(--text-muted)"><a href="/whatsapp.html" style="color:var(--accent)">QR kodu tara</a></small>`;
            }
        } catch (e) { }
    }

    // ==================== BAŞLANGIÇ ====================

    // Karşılama mesajı
    addMessage('bot',
        `Merhaba! Ben Site Güvenlik Asistanıyım. 🤖\n\nSize şu konularda yardımcı olabilirim:\n\n• Giriş kayıtlarını sorgulama\n• Sakin arama ve yönetimi\n• İstatistik ve raporlar\n• Anomali tespiti\n\nNe öğrenmek istersiniz?`
    );

    loadAlerts();
    loadStats();
    loadWaStatus();

    // Her 30 saniyede güncelle
    setInterval(loadAlerts, 30000);
    setInterval(loadStats, 30000);
    setInterval(loadWaStatus, 15000);

    function showToast(msg, type='info') {
        const icons = {success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
        const c = document.getElementById('toasts');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.innerHTML = `${icons[type]} ${msg}`;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3500);
    }
    </script>
</body>
</html>
